<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedientes - Pasitos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/expedientes.css">
</head>

<body>

    <!-- navbar -->
    <div id="navbar-container"></div>

    <main class="main-container">

        <div class="page-header">
            <h1 class="page-title">Expedientes</h1>
        </div>

        <section class="form-card exp-search-section">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input class="form-control" id="inputBuscar" type="search" autocomplete="off" placeholder="Buscar por nombre o apellidos" aria-label="Buscar paciente">
                <button class="search-clear" id="btnLimpiar" type="button" aria-label="Limpiar búsqueda">&times;</button>
            </div>
            <p class="result-count" id="conteoResultados"></p>
            <div id="contenedorResultados">
                <div class="empty-state">
                    <p>Cargando pacientes...</p>
                </div>
            </div>
        </section>

    </main>

    <script src="js/navbar.js"></script>
    <script src="js/expedientes.js"></script>
</body>

</html>
