<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pasitos A.C.</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo img {
            height: 90px;
            object-fit: contain;
        }
        .login-form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }
        .login-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="login-logo">
            <img src="assets/logo.png" alt="Logo Pasitos A.C.">
        </div>
        
        <form id="formLogin" class="form-card login-card" autocomplete="off">
            <h1 class="section-title login-title">Iniciar Sesión</h1>
            
            <div class="login-form-grid">
                <div class="form-group">
                    <label class="form-label" for="email">Correo electrónico <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="correo@pasitos.org" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>

            <!-- Contenedor para alertas de error -->
            <div id="loginAlert" style="color: #dc2626; font-size: 0.9rem; text-align: center; display: none; margin-top: 1rem;"></div>
            
            <div class="form-actions" style="justify-content: center; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem;">Ingresar al sistema</button>
            </div>
        </form>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
